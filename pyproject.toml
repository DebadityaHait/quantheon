[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantheon"
version = "0.2.0"
description = "Agentic derivatives pricing and hedging desk"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.124.0",
  "uvicorn>=0.38.0",
  "sqlalchemy>=2.0.25",
  "alembic>=1.17.0",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "python-docx>=1.1.2",
  "pypdf>=5.1",
  "pypdfium2>=4.30",
  "pandas>=2.0.0",
  "pyarrow>=18.0.0",
  "openpyxl>=3.1.0",
  "matplotlib>=3.9.0",
  "plotly>=5.24.0",
  "kaleido>=0.2.1",
  "numpy>=1.24.0",
  "python-dateutil>=2.8.0",
  "seaborn>=0.13.0",
  "scipy>=1.14.0",
  "pyyaml>=6.0",
  "markdown>=3.5",
  "ruamel.yaml>=0.18.0",
  "langchain>=1.4.2",
  "langchain-deepseek>=1.1.1",
  "langchain-openai>=1.6.6",
  "langgraph>=1.2.12",
  "aiosqlite>=0.20.0",
  "langsmith>=0.4.0",
  "deepagents[quickjs]>=0.7.19",
  "akshare>=1.16.0",
  # Quantheon Engine is bundled in backend/quantheon_engine.
  "langgraph-checkpoint-sqlite>=3.1.1",
  "langchain-sandbox>=0.0.3",
  "typer>=0.12.0",
  "lark-oapi>=1.3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
open-otc = "app.cli:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
quantheon_engine = ["LICENSE", "NOTICE"]
"quantheon_engine.util.calendar" = ["holidayfile/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q"
